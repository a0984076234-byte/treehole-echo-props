    const turns = {
      chen: [
        { kind: "question", text: "明明身边一直有人，为什么我还是不敢说自己难过？" },
        { kind: "answer", text: "把话说出口是有代价的。你怕对方担心，也怕对方接不住，最后还要反过来安慰他。所以白天照常笑，等宿舍熄灯，才把话打在没人看见的地方。" },
        { kind: "question", text: "如果我不想解释呢？" },
        { kind: "answer", text: "那就不解释。有些话在心里排练了很多遍，打出来又删掉，最后只留下一句“没事”。" }
      ],
      luye: [
        { kind: "question", text: "为什么我明明很累，还是忍不住往人堆里挤，怕被落下？" },
        { kind: "answer", text: "我十分理解你的心情。你这种习惯性讨好合群，大多来自你过去一次刻骨铭心的难堪经历。" },

ong data-artifact="log">${done?'已保存':'记录中'}</strong></div>`:`<div class="dark-row"><span>采集内容</span><strong>帖子正文</strong></div><div class="dark-row"><span>身份字段</span><strong>已清理</strong></div><div class="dark-row"><span>校验状态</span><strong id="checksumStatus">${done?'通过':'待校验'}</strong></div>`}</div></section></aside></div></div></main></div><footer class="terminal-statusbar"><span>workspace: echo　　|　　branch: main</span><span><span data-terminal-status>${status}</span>　　UTF-8　　${cfg.file}</span></footer></section>`;

    function fitCanvas(){const presenting=document.body.classList.contains('presenting');let w,h;if(presenting){w=window.innerWidth;h=window.innerHeight;stage.style.width='100vw';stage.style.height='100dvh';}else{const work=document.querySelector('.work'),maxHeight=Math.max(200,window.innerHeight-stage.getBoundingClientRect().top-42);w=Math.min(work.clientWidth,maxHeight*16/9);h=w*9/16;stage.style.width=w+'px';stage.style.height=h+'px';w=stage.clientWidth;h=stage.clientHeight;}const scale=Math.min(w/1600,h/900);state.presentationScale=scale;screen.style.width=(w/scale)+'px';screen.style.height=(h/scale)+'px';screen.style.transform=`scale(${scale})`;}

    document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(state.shotOpen!==null){state.shotOpen=null;render();return;}if(document.body.classList.contains('presenting'))exitPresentation();return;}if(e.target.matches('input,textarea,[contenteditable]')){if(e.target.id==='testInput'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();advance();}return;}if(!document.body.classList.contains('presenting'))return;if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();advance();}else if(e.key==='ArrowLeft'){e.preventDefault();retreat();}else if(e.key.toLowerCase()==='r'){e.preventDefault();resetCurrent();}else if(e.key.toLowerCase()==='p'&&(terminalConfig[state.prop]||state.prop==='V14')){e.preventDefault();toggleMotion();}});
    window.addEventListener('resize',fitCanvas);
    new ResizeObserver(fitCanvas).observe(document.querySelector('.work'));
    document.addEventListener('visibilitychange',()=>{if(animation)animation.last=0;});
    reducedMotion.addEventListener('change',()=>{if(reducedMotion.matches){stopAnimation(true);updateTerminalDom();}});
    render();

</script></body></html>
